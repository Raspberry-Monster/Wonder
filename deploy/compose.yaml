name: wonder
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wonder
      POSTGRES_USER: wonder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "max_connections=40"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonder -d wonder"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:6379:6379"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Database=wonder;Username=wonder;Password=${POSTGRES_PASSWORD};Maximum Pool Size=20
      ConnectionStrings__Redis: redis:6379
      Authentication__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Backups__AgeRecipient: ${AGE_RECIPIENT:-}
      SystemAdminIds__0: ${SYSTEM_ADMIN_ID:-}
      DOTNET_GCHeapHardLimit: "0x40000000"
    volumes:
      - app-data:/app/data
      - deletion-ledger:/app/data/deletion-ledger
    ports: ["127.0.0.1:5080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  app-data:
  deletion-ledger:
