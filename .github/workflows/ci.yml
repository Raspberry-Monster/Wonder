name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: wonder
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wonder -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WONDER_TEST_POSTGRES: Host=localhost;Database=postgres;Username=wonder;Password=ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Wonder.Web/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: src/Wonder.Web
      - run: dotnet restore Wonder.slnx
      - run: dotnet test --solution Wonder.slnx --configuration Release --no-restore
      - run: dotnet build src/Wonder.Host --no-restore
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: src/Wonder.Web
      - run: dotnet publish src/Wonder.Host -c Release --no-restore -p:SkipFrontendBuild=true -o artifacts/host
