<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Wonder · 控制台</title>
    <link href="/app.css" rel="stylesheet">
    <script src="/app.js" type="module"></script>
</head>
<body>
<div aria-live="polite" id="toast" role="status"></div>
<section class="login" id="login">
    <div class="login-intro"><span class="mark">w.</span>
        <p class="eyebrow">A LITTLE CONTINUITY</p>
        <h1>让每一次对话，<br>都有下文。</h1>
        <p>Wonder 的实例、表达与记忆，<br>在这里慢慢整理。</p></div>
    <form class="card auth" id="auth-form"><p class="eyebrow">WONDER CONSOLE</p>
        <h2>欢迎回来</h2><label>邮箱<input autocomplete="username" name="email" required type="email"></label><label>密码<input
                autocomplete="current-password" minlength="12" name="password" required type="password"></label>
        <button>登录</button>
        <button class="secondary" id="register" type="button">创建账号</button>
        <p class="muted" id="auth-error" role="alert"></p></form>
</section>
<div hidden id="shell">
    <aside><a class="brand" href="/">wonder<span>●</span></a>
        <p class="eyebrow">你的控制台</p>
        <button class="nav active" data-view="bots">01　Bot 工作台</button>
        <button class="nav" data-view="memories">02　我的记忆</button>
        <div class="aside-bottom"><p class="muted" id="account"></p>
            <button class="text-button" id="logout">退出登录 ↗</button>
        </div>
    </aside>
    <main>
        <header>
            <div><p class="eyebrow" id="page-kicker">YOUR INSTANCES</p>
                <h1 id="page-title">Bot 工作台</h1></div>
            <button class="secondary" id="refresh">刷新 ↻</button>
        </header>
        <section id="content"></section>
        <footer>Wonder v0.1 <span>保持身份，延续对话。</span></footer>
    </main>
</div>
<dialog id="create-dialog">
    <form id="create-form"><p class="eyebrow">NEW INSTANCE</p>
        <h2>一个新的开始</h2><label>实例名称<input maxlength="100" name="name" placeholder="Wonder"
                                                   required></label><label>角色身份<textarea maxlength="4000"
                                                                                                         name="identity"
                                                                                                         placeholder="称呼、基本说话方式，以及希望始终保留的特点。"
                                                                                                         required
                                                                                                         rows="6"></textarea></label>
        <div class="actions">
            <button>创建实例</button>
            <button class="secondary" id="close-create" type="button">取消</button>
        </div>
    </form>
</dialog>
</body>
</html>
